{% extends "base.html" %}
{% block title %}Travel profile{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto">
  <h1 class="text-3xl font-extrabold">Travel profile</h1>
  <p class="text-slate-500 mt-1">These preferences are used as defaults when you plan a trip.</p>
  <form method="post" class="card p-6 mt-6 space-y-5">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <div class="grid md:grid-cols-2 gap-4">
      <div><label class="label">Name</label><input class="input" name="name" value="{{ current_user.name }}"></div>
      <div><label class="label">Home state</label><input class="input" name="home_state" value="{{ prof.home_state or '' }}" placeholder="e.g. Melaka"></div>
      <div><label class="label">Travel style</label>
        <select class="input" name="travel_style">
          {% for v, l in [('budget','Budget (cheap meals)'),('moderate','Moderate'),('luxury','Luxury')] %}
          <option value="{{ v }}" {{ 'selected' if prof.travel_style == v }}>{{ l }}</option>{% endfor %}
        </select></div>
      <div><label class="label">Pace</label>
        <select class="input" name="pace">
          {% for v, l in [('relaxed','Relaxed (up to 3 places/day)'),('normal','Normal (up to 4/day)'),('packed','Packed (up to 6/day)')] %}
          <option value="{{ v }}" {{ 'selected' if prof.pace == v }}>{{ l }}</option>{% endfor %}
        </select></div>
      <div><label class="label">Usual budget per trip (RM)</label><input class="input" type="number" min="50" step="50" name="default_budget" value="{{ (prof.default_budget or 1000)|int }}"></div>
    </div>
    <div>
      <label class="label">Interests</label>
      {% set mine = (prof.interests or '').split(',') %}
      <div class="flex flex-wrap gap-2">
        {% for i in interests %}
        <label class="cursor-pointer"><input type="checkbox" name="interests" value="{{ i }}" class="peer sr-only" {{ 'checked' if i in mine }}>
          <span class="chip px-3 py-1.5 text-sm border border-slate-300 text-slate-600 peer-checked:bg-brand-600 peer-checked:text-white peer-checked:border-brand-600">{{ i|capitalize }}</span></label>
        {% endfor %}
      </div>
    </div>
    <button class="btn-primary">Save profile</button>
  </form>
</div>
{% endblock %}
