{% extends "base.html" %}
{% block title %}{{ 'Edit' if a.id else 'Add' }} travel asset{% endblock %}
{% block content %}
<div class="max-w-3xl mx-auto">
  <a href="{{ url_for('admin.assets') }}" class="text-sm text-slate-500 hover:text-brand-700">← Travel assets</a>
  <h1 class="text-3xl font-extrabold mt-1">{{ 'Edit' if a.id else 'Add' }} travel asset</h1>
  <form method="post" class="card p-6 mt-6 space-y-5">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <div class="grid md:grid-cols-2 gap-4">
      <div class="md:col-span-2"><label class="label">Name</label><input class="input" name="name" value="{{ a.name or '' }}" required></div>
      <div><label class="label">Type</label><select class="input" name="asset_type">
        <option value="attraction" {{ 'selected' if a.asset_type != 'accommodation' }}>Attraction</option>
        <option value="accommodation" {{ 'selected' if a.asset_type == 'accommodation' }}>Accommodation (hotel)</option></select></div>
      <div><label class="label">Main category</label><select class="input" name="category">
        {% for c in categories + ['hotel'] %}<option {{ 'selected' if a.category == c }}>{{ c }}</option>{% endfor %}</select></div>
      <div><label class="label">Region</label><select class="input" name="region">
        {% for r in regions %}<option {{ 'selected' if a.region == r }}>{{ r }}</option>{% endfor %}</select></div>
      <div><label class="label">…or new region</label><input class="input" name="new_region" placeholder="e.g. Ipoh"></div>
      <div class="md:col-span-2"><label class="label">Extra tags <span class="font-normal text-slate-400">(comma separated; used for interest matching)</span></label>
        <input class="input" name="tags" value="{{ a.tags or '' }}" placeholder="e.g. temple,view,family"></div>
      <div><label class="label">Latitude</label><input class="input" name="latitude" type="number" step="any" value="{{ a.latitude or '' }}" required></div>
      <div><label class="label">Longitude</label><input class="input" name="longitude" type="number" step="any" value="{{ a.longitude or '' }}" required></div>
      <p class="md:col-span-2 -mt-2 text-xs text-slate-500">Tip: in Google Maps, right-click the place and click the numbers to copy "latitude, longitude".</p>
      <div><label class="label">Cost (RM per person; per room per night for hotels)</label><input class="input" name="est_cost" type="number" step="0.5" min="0" value="{{ a.est_cost or 0 }}"></div>
      <div><label class="label">Visit time (minutes)</label><input class="input" name="visit_minutes" type="number" min="0" value="{{ a.visit_minutes or 60 }}"></div>
      <div><label class="label">Opens</label><input class="input" name="open_time" type="time" value="{{ a.open_time or '09:00' }}"></div>
      <div><label class="label">Closes</label><input class="input" name="close_time" type="time" value="{{ a.close_time or '18:00' }}"></div>
      <div><label class="label">Rating (1-5)</label><input class="input" name="rating" type="number" step="0.1" min="1" max="5" value="{{ a.rating or 4 }}"></div>
      <label class="flex items-center gap-2 mt-7 text-sm font-semibold"><input type="checkbox" name="is_active" {{ 'checked' if a.is_active }}> Active (used by the planner)</label>
      <div class="md:col-span-2"><label class="label">Description</label><textarea class="input" name="description" rows="3">{{ a.description or '' }}</textarea></div>
    </div>
    <button class="btn-primary">Save</button>
  </form>
</div>
{% endblock %}
