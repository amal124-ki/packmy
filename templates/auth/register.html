{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
<div class="max-w-md mx-auto card p-8 mt-6">
  <img src="{{ url_for('static', filename='img/logo-full.png') }}" alt="PackMY - Travel Planner" class="h-40 mx-auto mb-4 rounded-xl">
  <h1 class="text-2xl font-extrabold">Create your account</h1>
  <p class="text-slate-500 text-sm mt-1">Free. Start planning in a minute.</p>
  <form method="post" class="mt-6 space-y-4">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <div><label class="label" for="name">Full name</label><input class="input" id="name" name="name" required></div>
    <div><label class="label" for="email">Email</label><input class="input" type="email" id="email" name="email" required></div>
    <div><label class="label" for="password">Password</label><input class="input" type="password" id="password" name="password" minlength="6" required></div>
    <div><label class="label" for="confirm">Confirm password</label><input class="input" type="password" id="confirm" name="confirm" minlength="6" required></div>
    <button class="btn-primary w-full">Create account</button>
  </form>
  <p class="text-sm text-slate-500 mt-6 text-center">Already registered? <a class="text-brand-700 font-semibold" href="{{ url_for('auth.login') }}">Log in</a></p>
</div>
{% endblock %}
