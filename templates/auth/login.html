{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="max-w-md mx-auto card p-8 mt-6">
  <img src="{{ url_for('static', filename='img/logo-full.png') }}" alt="PackMY - Travel Planner" class="h-40 mx-auto mb-4 rounded-xl">
  <h1 class="text-2xl font-extrabold">Welcome back</h1>
  <p class="text-slate-500 text-sm mt-1">Log in to plan and view your trips.</p>
  <form method="post" class="mt-6 space-y-4">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <div><label class="label" for="email">Email</label><input class="input" type="email" id="email" name="email" required autofocus></div>
    <div><label class="label" for="password">Password</label><input class="input" type="password" id="password" name="password" required></div>
    <label class="flex items-center gap-2 text-sm text-slate-600"><input type="checkbox" name="remember" class="rounded"> Remember me</label>
    <button class="btn-primary w-full">Log in</button>
  </form>
  <p class="text-sm text-slate-500 mt-6 text-center">No account? <a class="text-brand-700 font-semibold" href="{{ url_for('auth.register') }}">Sign up</a></p>
  
</div>
{% endblock %}
